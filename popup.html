<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Ashby Helper</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="popup">
    <header><span class="badge">APPLICATION HELPER</span>
        <h1>Less typing.<br>More opportunities.</h1>
    </header>
    <p>Fill an Ashby application with your saved details.</p>
    <div class="actions"><button id="preview">Preview fields</button><button id="profile" class="secondary">Edit
            profile</button></div>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="fields"></div>
    <button id="fill" hidden>Fill selected fields</button>
    <footer>Review your application before submitting. Files and custom dropdowns are completed manually.</footer>
    <script src="popup.js"></script>
</body>

</html>
